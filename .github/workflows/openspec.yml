name: OpenSpec

on:
  pull_request:
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yml'
  push:
    branches: [master]
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate specifications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - name: Validate all OpenSpec changes and specifications
        run: npx --yes @fission-ai/openspec@1.14.1 validate --all --strict --no-interactive
