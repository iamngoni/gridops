schema: spec-driven

context: |
  Fleet changes cover the complete native Linux, macOS, and Windows fleet;
  workstream order never reduces that scope to an MVP. Preserve
  Rust 2024/Tokio/Axum, SQLx/SQLite WAL, and the existing React/Vite/Tailwind UI,
  plus GitHub and Bitbucket integrations. SQLite is one control-plane authority;
  do not introduce a broker, Kubernetes, active-active controllers, or a stack
  rewrite. Existing runners remain visible and are never silently adopted.
  Distinguish local/CI checks from real host, upstream, and platform evidence.
  Advertised platform and upstream support requires execution evidence before
  release acceptance; unverified rows remain pending.

rules:
  proposal:
    - List each new capability delta and identify any modified capability requirements.
    - Keep implementation details in design.md and identify non-goals.
  design:
    - Include domain/schema, API/protocol, timing limits, fencing, and unknown outcomes.
    - Cover shared budgets, fairness, migration/rollback, trust/RBAC, platform support, and proof separation.
  tasks:
    - Group tasks by dependency and source ownership; every task must name meaningful proof.
    - Include relevant platform adapters, integrations, migrations, upgrades, and evidence.
